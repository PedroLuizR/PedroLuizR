<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="tip" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#8C6DCF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#24183E" flood-opacity="0.08"/>
    </filter>
    <style>
      .col { fill: #F2EFFB; }
      .colTitle { fill: #8C6DCF; font-size: 18px; font-weight: 700; letter-spacing: 3px; }
      .colStep { fill: #FFFFFF; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .h { fill: #24183E; font-size: 25px; font-weight: 700; }
      .s { fill: #756D87; font-size: 18px; font-weight: 500; }
      .curve { fill: none; stroke: #8C6DCF; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2 9; }
      .tag { font-size: 16px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FAF9FD"/>

  <!-- Título -->
  <text x="90" y="105" font-size="52" font-weight="700" fill="#24183E">Como o PAW cuida do Bento</text>
  <text x="92" y="145" font-size="22" font-weight="500" fill="#756D87">Da coleira à clínica, em três passos.</text>

  <!-- Colunas -->
  <rect class="col" x="70" y="195" width="470" height="600" rx="36"/>
  <rect class="col" x="580" y="195" width="440" height="600" rx="36"/>
  <rect class="col" x="1060" y="195" width="470" height="600" rx="36"/>

  <g>
    <circle cx="118" cy="240" r="18" fill="#8C6DCF"/><text class="colStep" x="118" y="246">1</text>
    <text class="colTitle" x="148" y="247">COLETA</text>
    <circle cx="628" cy="240" r="18" fill="#8C6DCF"/><text class="colStep" x="628" y="246">2</text>
    <text class="colTitle" x="658" y="247">ENTENDE</text>
    <circle cx="1108" cy="240" r="18" fill="#8C6DCF"/><text class="colStep" x="1108" y="246">3</text>
    <text class="colTitle" x="1138" y="247">AGE</text>
  </g>

  <!-- Coleta: coleira -->
  <g filter="url(#soft)">
    <rect x="100" y="300" width="410" height="150" rx="28" fill="#FFFFFF"/>
  </g>
  <rect x="124" y="330" width="88" height="88" rx="24" fill="#6D83CF"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
    <ellipse cx="168" cy="365" rx="27" ry="14"/>
    <rect x="160" y="377" width="16" height="10" rx="3" fill="#A0CF6D" stroke="none"/>
  </g>
  <text class="h" x="234" y="365">Coleira PAW One</text>
  <text class="s" x="234" y="397">batimento · atividade · bateria</text>

  <!-- Coleta: tutor -->
  <g filter="url(#soft)">
    <rect x="100" y="545" width="410" height="150" rx="28" fill="#FFFFFF"/>
  </g>
  <rect x="124" y="576" width="88" height="88" rx="24" fill="#F4F1E8"/>
  <path d="M146 598 h44 a8 8 0 0 1 8 8 v22 a8 8 0 0 1 -8 8 h-26 l-12 10 v-10 h-6 a8 8 0 0 1 -8 -8 v-22 a8 8 0 0 1 8 -8 z" fill="none" stroke="#B5AE52" stroke-width="4" stroke-linejoin="round"/>
  <text class="h" x="234" y="610">Você, no chat</text>
  <text class="s" x="234" y="642">“ele está coçando a orelha”</text>

  <!-- Entende: núcleo IA -->
  <circle cx="800" cy="495" r="150" fill="#E6E1F2"/>
  <circle cx="800" cy="495" r="118" fill="#8C6DCF" filter="url(#soft)"/>
  <circle cx="800" cy="495" r="118" fill="none" stroke="#A0CF6D" stroke-width="5" stroke-dasharray="40 14"/>
  <path d="M800 420 l9 26 l26 9 l-26 9 l-9 26 l-9 -26 l-26 -9 l26 -9 z" fill="#FFFFFF"/>
  <text x="800" y="528" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">PAW IA</text>
  <text x="800" y="556" text-anchor="middle" font-size="17" font-weight="500" fill="#F2EFFB">cruza sinais + relato</text>

  <!-- Age: tudo em dia -->
  <g filter="url(#soft)">
    <rect x="1090" y="300" width="410" height="150" rx="28" fill="#FFFFFF"/>
  </g>
  <rect x="1114" y="330" width="88" height="88" rx="24" fill="#A0CF6D"/>
  <path d="M1138 375 l14 14 l28 -30" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="h" x="1224" y="365">Tudo em dia</text>
  <text class="s" x="1224" y="397">resumo na tela Início</text>

  <!-- Age: atenção -->
  <g filter="url(#soft)">
    <rect x="1090" y="545" width="410" height="150" rx="28" fill="#FFFFFF"/>
  </g>
  <rect x="1114" y="576" width="88" height="88" rx="24" fill="#C87550"/>
  <path d="M1158 600 v40 M1138 620 h40" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <text class="h" x="1224" y="610">Hora da clínica</text>
  <text class="s" x="1224" y="642">mapa + chat com a vet</text>

  <!-- Curvas -->
  <path class="curve" d="M510 375 C 590 375, 610 430, 668 452" marker-end="url(#tip)"/>
  <path class="curve" d="M510 620 C 590 620, 610 560, 668 538" marker-end="url(#tip)"/>
  <path class="curve" d="M932 452 C 990 430, 1010 375, 1084 375" marker-end="url(#tip)"/>
  <path class="curve" d="M932 538 C 990 560, 1010 620, 1084 620" marker-end="url(#tip)"/>

  <!-- Etiquetas das saídas -->
  <rect x="888" y="318" width="118" height="34" rx="17" fill="#A0CF6D"/>
  <text class="tag" x="947" y="341" text-anchor="middle" fill="#24183E">estável</text>
  <rect x="866" y="650" width="148" height="34" rx="17" fill="#C87550"/>
  <text class="tag" x="940" y="673" text-anchor="middle" fill="#FFFFFF">algo diferente</text>

  <!-- Aviso -->
  <rect x="580" y="820" width="440" height="44" rx="22" fill="#F2EFFB"/>
  <text x="800" y="848" text-anchor="middle" font-size="17" font-weight="500" fill="#8C6DCF">✦ Orientação inicial. Não substitui o veterinário.</text>
</svg>
