<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img" aria-label="Pedro Luiz — Desenvolvedor Back-End · Java, Spring Boot e MongoDB">
<style>
  .orb{animation:float 9s ease-in-out infinite}
  .orb2{animation:float 11s ease-in-out infinite reverse}
  @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,18px)}}
  .rot{opacity:0;animation:cycle 12s infinite}
  .r2{animation-delay:4s}.r3{animation-delay:8s}
  @keyframes cycle{0%{opacity:0;transform:translateY(8px)}4%,29%{opacity:1;transform:translateY(0)}33%,100%{opacity:0;transform:translateY(-8px)}}
  .pulse{animation:pulse 2.2s ease-out infinite;transform-origin:331px 229px}
  @keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
  .shine{animation:shine 6s linear infinite}
  @keyframes shine{from{transform:translateX(-500px)}to{transform:translateX(900px)}}
  .cur{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.orb,.orb2,.pulse,.shine,.cur{animation:none}.rot{animation:none}.r1{opacity:1}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#140d26"/><stop offset="1" stop-color="#0b0814"/>
  </linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ede9fe"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#e9d5ff"/>
  </linearGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/><stop offset=".3" stop-color="#8b5cf6"/>
    <stop offset=".6" stop-color="#d946ef"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="o1"><stop offset="0" stop-color="#7c3aed" stop-opacity=".55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  <radialGradient id="o2"><stop offset="0" stop-color="#c026d3" stop-opacity=".35"/><stop offset="1" stop-color="#c026d3" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#3b2d63" opacity=".55"/></pattern>
  <clipPath id="clip"><rect width="880" height="270" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="880" height="270" fill="url(#bg)"/>
  <rect width="880" height="270" fill="url(#dots)"/>
  <circle class="orb" cx="170" cy="60" r="230" fill="url(#o1)"/>
  <circle class="orb2" cx="740" cy="230" r="220" fill="url(#o2)"/>
  <rect class="shine" x="0" y="0" width="260" height="270" fill="url(#sh)" transform="skewX(-20)"/>
</g>
<rect x=".5" y=".5" width="879" height="269" rx="18" fill="none" stroke="#3b2a6b"/>

<!-- janela -->
<circle cx="30" cy="28" r="5" fill="#f472b6" opacity=".8"/><circle cx="48" cy="28" r="5" fill="#c084fc" opacity=".8"/><circle cx="66" cy="28" r="5" fill="#818cf8" opacity=".8"/>
<text x="850" y="32" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6d5fa0">~/pedro-luiz <tspan fill="#a78bfa">main</tspan></text>

<text x="440" y="100" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#8b7fc0" letter-spacing="2">&lt;olá, mundo /&gt;  eu sou</text>
<text x="440" y="152" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="52" font-weight="800" letter-spacing="8" fill="url(#name)">PEDRO LUIZ</text>
<rect x="250" y="168" width="380" height="2" rx="1" fill="url(#rule)"/>

<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" text-anchor="middle" fill="#c4b5fd">
  <text class="rot r1" x="440" y="200"><tspan fill="#e879f9">&gt;</tspan> Desenvolvedor Back-End</text>
  <text class="rot r2" x="440" y="200"><tspan fill="#e879f9">&gt;</tspan> Java · Spring Boot · MongoDB</text>
  <text class="rot r3" x="440" y="200"><tspan fill="#e879f9">&gt;</tspan> Engenharia de Software · Fametro</text>
</g>

<rect x="314" y="214" width="252" height="30" rx="15" fill="#120c22" stroke="#3b2a6b"/>
<circle class="pulse" cx="331" cy="229" r="5" fill="none" stroke="#a78bfa"/>
<circle cx="331" cy="229" r="4.5" fill="#a78bfa"/>
<text x="449" y="233.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#c4b5fd">aberto a estágio e júnior<tspan class="cur" fill="#e879f9"> _</tspan></text>
<text x="850" y="252" text-anchor="end" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#5f548c">Manaus · AM · Brasil</text>
</svg>
