<svg xmlns="http://www.w3.org/2000/svg" width="880" height="252" viewBox="0 0 880 252" role="img" aria-label="HydraLab: monitoramento em tempo real da qualidade da água para comunidades ribeirinhas da Amazônia. Arduino com sensores de pH, turbidez e temperatura, Node.js, Express, Socket.IO e MongoDB.">
<style>
text{font-family:'JetBrainsMono Nerd Font','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:500;white-space:pre}
.tab{font-size:11.5px}
.f{opacity:0;animation:in .35s ease-out forwards}
@keyframes in{to{opacity:1}}
.cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.ln{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 2.4s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}.live{animation:pl 1.6s ease-in-out infinite}@keyframes pl{50%{opacity:.25}}@media (prefers-reduced-motion:reduce){.ln{animation:none;stroke-dashoffset:0}.live{animation:none}}
@media (prefers-reduced-motion:reduce){.f{animation:none;opacity:1}.cur{animation:none}}
</style>
